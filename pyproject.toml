[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-swe2"
version = "1.0.0"
description = "Hermes Agent model-provider plugin: Cognition Devin CLI (SWE-2) via `devin acp`"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GodsBoy" }]

[project.entry-points."hermes_agent.plugins"]
devin = "devin_provider:register"

[tool.setuptools]
py-modules = ["devin_provider", "devin_acp_client"]

[tool.ruff]
# Mirrors the upstream hermes-agent style: broad exception guards are
# intentional at plugin boundaries (a plugin must never take the agent down),
# and the repo directory name is a git slug, not an importable module name.
lint.ignore = ["BLE001", "N999"]
